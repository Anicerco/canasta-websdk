<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Logo de Canasta (demo): canasta blanca con hojas sobre el verde de la marca -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23994A"/>
      <stop offset="1" stop-color="#11602B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- asa -->
  <path d="M166 236 C166 150 346 150 346 236" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  <!-- hojas / verdura asomando -->
  <path d="M232 214 C214 170 236 136 270 128 C276 164 262 196 232 214 Z" fill="#8BE0A4"/>
  <path d="M262 218 C268 178 300 160 334 168 C322 200 296 218 262 218 Z" fill="#B8F0C8"/>
  <circle cx="206" cy="216" r="26" fill="#FF7A00"/>
  <!-- borde superior de la canasta -->
  <rect x="112" y="226" width="288" height="44" rx="22" fill="#FFFFFF"/>
  <!-- cuerpo -->
  <path d="M132 270 H380 L352 394 C349 408 337 418 322 418 H190 C175 418 163 408 160 394 Z" fill="#FFFFFF"/>
  <!-- tejido -->
  <g stroke="#1B7F3B" stroke-width="14" stroke-linecap="round">
    <line x1="206" y1="296" x2="214" y2="392"/>
    <line x1="256" y1="296" x2="256" y2="392"/>
    <line x1="306" y1="296" x2="298" y2="392"/>
  </g>
</svg>
